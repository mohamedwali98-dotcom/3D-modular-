[project]
name = "s2c"
version = "0.1.0"
description = "Sketch or photo to parametric CAD"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.7",
  "openai>=1.40",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "gradio>=4.40",
  "cadquery>=2.4",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "pillow>=10",
  "python-dotenv>=1.0",
  "scikit-image>=0.24",
  "scipy>=1.13",
  "skan>=0.12",
  "httpx>=0.27",
  "trimesh>=4.4",
  "ezdxf>=1.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
ai = [
  "torch>=2.4",
  "transformers>=4.44",
  "rembg[cpu]>=2.0.57",
  "scikit-image>=0.24",
  "trimesh>=4.4",
  "omegaconf>=2.3",
  "einops>=0.7",
  "imageio>=2.34",
  "gradio_client>=1.3",
]
ocr = ["paddleocr>=3.0", "paddlepaddle>=3.0"]
trocr = ["transformers>=5", "torch>=2.4"]  # TrOCR is tested on transformers 5

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The ai extra's torch comes from PyTorch's CUDA 12.6 build on Windows and Linux, so an NVIDIA GPU is used
# (driver 560 or newer); without a GPU the same build runs on the CPU. macOS keeps the default build.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["s2c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that need a GPU, a hosted model, PrusaSlicer, Blender or the dataset run only when asked (-m gpu, ...).
addopts = "-m 'not gpu and not network and not slicer and not blender and not dataset'"
markers = [
  "gpu: needs a CUDA GPU and the ai extra",
  "slicer: needs PrusaSlicer installed",
  "network: calls a hosted model; runs only with NETWORK_TESTS=1",
  "blender: needs Blender or bpy configured (BLENDER_PATH or BLENDER_PYTHON)",
  "dataset: needs the reverse-engineering dataset (RE_DATASET)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends"]
